/* ═══════════════ Motor de Gym Assistant ═══════════════
   Copia fiel de src/lib/reglas (progresion.ts, siguientePaso.ts, fuerza.ts y racha.ts)
   y de src/lib/config/gym.ts, para series rectas. El peso va en gramos enteros. */

const RANGOS = {
  fuerza: { peso: [3, 5], calistenia: [3, 6] },
  hipertrofia: { peso: [8, 12], calistenia: [8, 15] },
  resistencia: { peso: [15, 20], calistenia: [15, 25] },
};
const RIR_SALTO_DOBLE = 3;
const UMBRAL_PESO_ALTO = 50000;
const DONDE = 'en todas las series';

const FORMATO_KG = new Intl.NumberFormat('es-CO', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const kg = (gramos) => `${FORMATO_KG.format(gramos / 1000)} kg`;
const incrementoPeso = (g) => (g >= UMBRAL_PESO_ALTO ? 5000 : 2500);
const pesoDescarga = (g) => Math.max(0, Math.floor((g * 0.9) / 500) * 500);

function recomendarSiguiente({ tipo, rango, pesoG, reps, rir, anteriorBajo }) {
  const [min, max] = rango;
  const tope = reps.length > 0 && reps.every((r) => r >= max);
  const falla = reps.length === 0 || reps.some((r) => r < min);

  if (tipo === 'calistenia') {
    if (tope) return { accion: 'subir_variante', peso: null, meta: min, mensaje: `Llegaste a ${max} repeticiones ${DONDE}. Prueba una variante más difícil y vuelve a ${min} repeticiones.` };
    if (falla) return { accion: 'mantener', peso: null, meta: min, mensaje: anteriorBajo ? 'Es la segunda sesión seguida bajo el mínimo. Considera una variante más fácil hasta recuperar el rango.' : `No alcanzaste el mínimo ${DONDE}. Mantén la variante y repite el objetivo.` };
    return { accion: 'subir_reps', peso: null, meta: max, mensaje: `Cumpliste el rango. Mantén la variante y apunta a ${max} repeticiones ${DONDE} la próxima vez.` };
  }
  if (tope) {
    const doble = rir !== undefined && rir.length > 0 && rir.every((x) => x >= RIR_SALTO_DOBLE);
    const nuevo = pesoG + incrementoPeso(pesoG) * (doble ? 2 : 1);
    return {
      accion: 'subir_peso', peso: nuevo, meta: min,
      mensaje: doble
        ? `Llegaste a ${max} repeticiones con ${RIR_SALTO_DOBLE} o más en reserva ${DONDE}. Sube el doble, a ${kg(nuevo)}, y vuelve a ${min} repeticiones.`
        : `Llegaste a ${max} repeticiones ${DONDE}. Sube el peso a ${kg(nuevo)} y vuelve a ${min} repeticiones.`,
    };
  }
  if (falla && anteriorBajo && pesoG > 0) {
    const bajo = pesoDescarga(pesoG);
    return { accion: 'bajar_peso', peso: bajo, meta: min, mensaje: `Es la segunda sesión seguida bajo el mínimo. Baja a ${kg(bajo)} y vuelve a ${min} repeticiones para recuperar el rango.` };
  }
  if (falla) return { accion: 'mantener', peso: pesoG, meta: min, mensaje: `No alcanzaste el mínimo ${DONDE}. Mantén ${kg(pesoG)} y repite el objetivo.` };
  return { accion: 'subir_reps', peso: pesoG, meta: max, mensaje: `Cumpliste el rango. Mantén ${kg(pesoG)} y apunta a ${max} repeticiones ${DONDE} la próxima vez.` };
}

function fraseAccion(rec, tipo, rango) {
  const peso = kg(rec.peso ?? 0);
  if (tipo === 'calistenia') {
    if (rec.accion === 'subir_variante') return `Pasa a una versión más difícil del ejercicio y busca ${rec.meta} repeticiones por serie.`;
    if (rec.accion === 'subir_reps') return `Repite la misma versión del ejercicio e intenta llegar a ${rec.meta} repeticiones ${DONDE}.`;
    return `Repite la misma versión del ejercicio y busca al menos ${rango[0]} repeticiones ${DONDE}.`;
  }
  if (rec.accion === 'subir_peso') return `La próxima vez usa ${peso} y busca ${rec.meta} repeticiones por serie.`;
  if (rec.accion === 'subir_reps') return `Repite el mismo peso (${peso}) e intenta llegar a ${rec.meta} repeticiones ${DONDE}.`;
  if (rec.accion === 'bajar_peso') return `Esta semana baja a ${peso} para recuperarte; la siguiente vuelves a subir.`;
  return `Repite el mismo peso (${peso}) y busca al menos ${rango[0]} repeticiones ${DONDE}.`;
}

function tituloAccion(rec) {
  return {
    subir_peso: `Sube a ${kg(rec.peso ?? 0)}`,
    subir_reps: 'Suma repeticiones',
    bajar_peso: `Baja a ${kg(rec.peso ?? 0)} para recuperarte`,
    subir_variante: 'Pasa a una versión más difícil',
    mantener: 'Repite el mismo objetivo',
  }[rec.accion];
}

// Epley con reps + RIR, acotado a 12 repeticiones.
function estimar1RM(reps, pesoG, rir) {
  if (!pesoG || pesoG <= 0 || reps <= 0) return null;
  const r = Math.min(reps + (rir ?? 0), 12);
  return r === 1 ? pesoG : Math.round(pesoG * (1 + r / 30));
}

const restarDias = (fecha, dias) => {
  const d = new Date(`${fecha}T00:00:00Z`);
  d.setUTCDate(d.getUTCDate() - dias);
  return d.toISOString().slice(0, 10);
};
const diaSemana = (fecha) => { const d = new Date(`${fecha}T00:00:00Z`).getUTCDay(); return d === 0 ? 7 : d; };

function calcularRacha(fechas, hoy, dias) {
  const planificado = (f) => dias.includes(diaSemana(f));
  const entreno = new Set(fechas.filter((f) => f <= hoy));
  const primera = [...entreno].sort()[0];
  let actual = 0;
  for (let dia = hoy; primera !== undefined && dia >= primera; dia = restarDias(dia, 1)) {
    if (planificado(dia)) { if (entreno.has(dia)) actual += 1; else if (dia !== hoy) break; }
    else if (entreno.has(dia)) actual += 1;
  }
  let mejor = 0, seguidos = 0;
  for (let dia = primera; dia !== undefined && dia <= hoy; dia = restarDias(dia, -1)) {
    if (planificado(dia)) { if (entreno.has(dia)) seguidos += 1; else if (dia !== hoy) seguidos = 0; }
    else if (entreno.has(dia)) seguidos += 1;
    mejor = Math.max(mejor, seguidos);
  }
  return { actual, mejor: Math.max(mejor, actual), hoyEsDescanso: !planificado(hoy) };
}

/* ═══════════════ Simulador ═══════════════ */

const EJEMPLOS = [
  { texto: 'Llegó al tope', tipo: 'peso', enfoque: 'hipertrofia', peso: '40', reps: [12, 12, 12] },
  { texto: 'Tope sobrado (RIR 3)', tipo: 'peso', enfoque: 'hipertrofia', peso: '40', reps: [12, 12, 12], rir: [3, 3, 4] },
  { texto: 'Dentro del rango', tipo: 'peso', enfoque: 'hipertrofia', peso: '40', reps: [12, 11, 9] },
  { texto: 'Bajo el mínimo', tipo: 'peso', enfoque: 'hipertrofia', peso: '40', reps: [9, 8, 6] },
  { texto: 'Segunda vez bajo', tipo: 'peso', enfoque: 'hipertrofia', peso: '62.5', reps: [8, 7, 6], anterior: true },
  { texto: 'Calistenia', tipo: 'calistenia', enfoque: 'hipertrofia', peso: '0', reps: [15, 15, 15] },
];

const REGLAS = [
  ['Todas llegan al tope', 'Sube el peso', 'bg-emerald-100 text-emerald-900'],
  ['…y te sobraban 3+', 'Sube el doble', 'bg-emerald-100 text-emerald-900'],
  ['Todas en rango', 'Suma repeticiones', 'bg-sky-100 text-sky-900'],
  ['Alguna bajo el mínimo', 'Repite el objetivo', 'bg-slate-100 text-slate-800'],
  ['Dos veces seguidas bajo', 'Baja 10 %', 'bg-amber-100 text-amber-900'],
];

const aNumero = (v) => { const n = Number(String(v).replace(',', '.')); return Number.isFinite(n) && n >= 0 ? n : 0; };

function Simulador() {
  const [tipo, setTipo] = useState('peso');
  const [enfoque, setEnfoque] = useState('hipertrofia');
  const [peso, setPeso] = useState('40');
  const [series, setSeries] = useState([{ reps: '12', rir: '' }, { reps: '12', rir: '' }, { reps: '12', rir: '' }]);
  const [anterior, setAnterior] = useState(false);

  const rango = RANGOS[enfoque][tipo];
  const esPeso = tipo === 'peso';
  const pesoG = esPeso ? Math.round(aNumero(peso) * 1000) : 0;
  const reps = series.map((s) => Math.round(aNumero(s.reps)));
  const rir = series.every((s) => s.rir !== '') ? series.map((s) => Math.round(aNumero(s.rir))) : undefined;
  const rec = recomendarSiguiente({ tipo, rango, pesoG, reps, rir, anteriorBajo: anterior });

  let mejor = null;
  if (esPeso) series.forEach((s, i) => {
    const r = s.rir === '' ? 0 : Math.round(aNumero(s.rir));
    const v = estimar1RM(reps[i], pesoG, r);
    if (v !== null && (!mejor || v > mejor.v)) mejor = { v, i, r: Math.min(reps[i] + r, 12) };
  });

  const usar = (e) => {
    setTipo(e.tipo); setEnfoque(e.enfoque); setPeso(e.peso); setAnterior(!!e.anterior);
    setSeries(e.reps.map((r, i) => ({ reps: String(r), rir: e.rir ? String(e.rir[i]) : '' })));
  };
  const cambiar = (i, campo, v) => setSeries((a) => a.map((s, j) => (j === i ? { ...s, [campo]: v } : s)));

  const fondo = { subir_peso: 'from-emerald-600 to-emerald-800', subir_variante: 'from-emerald-600 to-emerald-800', subir_reps: 'from-sky-600 to-sky-800', mantener: 'from-slate-600 to-slate-800', bajar_peso: 'from-amber-600 to-amber-800' }[rec.accion];

  return (
    <Seccion id="simulador" className="bg-gradient-to-b from-[#f5f8f6] to-white">
      <Etiqueta>Pruébalo</Etiqueta>
      <Titulo id="simulador">Escribe tu última sesión. Mira qué sigue.</Titulo>
      <Intro>Las mismas reglas de la app: doble progresión sobre tu rango objetivo.</Intro>

      <div className="mt-6 flex flex-wrap gap-2" role="group" aria-label="Ejemplos rápidos">
        {EJEMPLOS.map((e) => (
          <button key={e.texto} type="button" onClick={() => usar(e)} className="min-h-11 rounded-full bg-white px-4 text-sm font-medium text-slate-700 ring-1 ring-slate-300 hover:bg-[#e4f1ea] hover:ring-[#2b7650]">{e.texto}</button>
        ))}
      </div>

      <div className="mt-6 grid gap-6 lg:grid-cols-[1.1fr_1fr]">
        <div className="rounded-3xl bg-white p-6 ring-1 ring-slate-200 sm:p-8">
          <div className="grid gap-5 sm:grid-cols-2">
            <Segmentos etiqueta="¿Con peso o con tu cuerpo?" valor={tipo} onCambio={setTipo} opciones={[{ valor: 'peso', texto: 'Con peso' }, { valor: 'calistenia', texto: 'Con mi cuerpo' }]} />
            <Segmentos etiqueta="¿Qué buscas?" valor={enfoque} onCambio={setEnfoque} opciones={[{ valor: 'fuerza', texto: 'Fuerza' }, { valor: 'hipertrofia', texto: 'Músculo' }, { valor: 'resistencia', texto: 'Resistencia' }]} />
          </div>
          <p className="mt-5 rounded-xl bg-[#e4f1ea] px-4 py-3 text-sm text-[#1d5238]">Repeticiones objetivo: <strong>{rango[0]} a {rango[1]}</strong></p>

          {esPeso && (
            <div className="mt-5">
              <label htmlFor="peso" className="text-sm font-semibold text-slate-700">Peso usado (kg)</label>
              <input id="peso" inputMode="decimal" value={peso} onChange={(e) => setPeso(e.target.value)} className="mt-2 block min-h-11 w-36 rounded-xl border border-slate-300 px-4 text-lg font-semibold" />
            </div>
          )}

          <fieldset className="mt-5">

}

function useMovimientoReducido() {
  const [reducido, setReducido] = useState(false);
  useEffect(() => {
    const m = window.matchMedia('(prefers-reduced-motion: reduce)');
    setReducido(m.matches);
    const cb = (e) => setReducido(e.matches);
    m.addEventListener('change', cb);
    return () => m.removeEventListener('change', cb);
  }, []);
  return reducido;
}

const LETRAS = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
const NOMBRES = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
const HOY = '2026-11-20';
const FECHAS = Array.from({ length: 21 }, (_, i) => restarDias('2026-11-02', -i));

function Racha() {
  const [dias, setDias] = useState([1, 3, 5]);
  const [sesiones, setSesiones] = useState(() => new Set(['2026-11-02', '2026-11-04', '2026-11-06', '2026-11-09', '2026-11-11', '2026-11-13', '2026-11-15', '2026-11-16', '2026-11-18', '2026-11-20']));
  const racha = useMemo(() => calcularRacha([...sesiones], HOY, dias), [dias, sesiones]);

  const alternarDia = (d) => setDias((a) => (a.includes(d) ? (a.length > 1 ? a.filter((x) => x !== d) : a) : [...a, d].sort()));
  const alternarSesion = (f) => setSesiones((a) => { const n = new Set(a); n.has(f) ? n.delete(f) : n.add(f); return n; });

  return (
    <Seccion id="racha" className="bg-white">
      <div className="grid gap-10 lg:grid-cols-[1fr_1.2fr]">
        <div>
          <Etiqueta>Racha</Etiqueta>

          <ul className="mt-6 space-y-3 text-lg text-slate-700">
            <li>✓ Descansar no la rompe.</li>
            <li>✓ Entrenar un día libre suma como extra.</li>
            <li>✓ Hoy tienes hasta medianoche.</li>
            <li>✓ Cambiar tus días no altera tu historial.</li>
          </ul>
        </div>

        <div className="rounded-3xl bg-[#f5f8f6] p-6 ring-1 ring-slate-200">
          <fieldset>
            <legend className="text-sm font-semibold">Tus días de entrenamiento</legend>
            <div className="mt-2 grid grid-cols-7 gap-1.5">
              {LETRAS.map((l, j) => {
                const d = j + 1, on = dias.includes(d);
                return <button key={l} type="button" aria-pressed={on} aria-label={NOMBRES[j]} onClick={() => alternarDia(d)} className={`min-h-11 rounded-xl text-sm font-bold ring-1 ${on ? 'bg-[#2b7650] text-white ring-[#2b7650]' : 'bg-white text-slate-700 ring-slate-300'}`}>{l}</button>;
              })}
            </div>
          </fieldset>
          <p className="mt-5 text-sm font-semibold">Toca un día para marcar o quitar una sesión <span className="font-normal text-slate-600">(hoy: viernes 20)</span></p>
          <div className="mt-2 grid grid-cols-7 gap-1.5" role="group" aria-label="Últimas tres semanas">
            {FECHAS.map((f) => {
              const ds = diaSemana(f), plan = dias.includes(ds), ok = sesiones.has(f), futuro = f > HOY, hoy = f === HOY;
              let clase = 'bg-white text-slate-500 ring-slate-200', estado = 'descanso';
              if (futuro) { clase = 'border border-dashed border-slate-300 text-slate-500 ring-transparent'; estado = 'por venir'; }
              else if (ok && plan) { clase = 'bg-[#2b7650] text-white ring-[#2b7650]'; estado = 'entrenaste'; }
              else if (ok) { clase = 'bg-sky-600 text-white ring-sky-600'; estado = 'día extra'; }
              else if (plan && !hoy) { clase = 'bg-amber-100 text-amber-900 ring-amber-400'; estado = 'perdido'; }
              else if (plan) { clase = 'bg-white text-slate-800 ring-[#2b7650]'; estado = 'hoy toca'; }
              return (
                <button key={f} type="button" disabled={futuro} aria-pressed={ok} aria-label={`${NOMBRES[ds - 1]} ${Number(f.slice(8))}: ${estado}`} onClick={() => alternarSesion(f)}
                  className={`min-h-11 rounded-xl text-sm font-semibold ring-1 ${clase} ${hoy ? 'outline outline-2 outline-offset-2 outline-[#0b1a13]' : ''}`}>
                  {Number(f.slice(8))}
                </button>
              );
            })}
          </div>
          <p className="mt-3 flex flex-wrap gap-x-4 gap-y-1 text-sm text-slate-700">
            <span><span aria-hidden="true" className="mr-1 inline-block h-3 w-3 rounded bg-[#2b7650]" />Entrenaste</span>
            <span><span aria-hidden="true" className="mr-1 inline-block h-3 w-3 rounded bg-sky-600" />Extra</span>
            <span><span aria-hidden="true" className="mr-1 inline-block h-3 w-3 rounded bg-amber-200" />Perdido</span>
          </p>
          <div aria-live="polite" className="mt-5 grid grid-cols-2 gap-3">
            <div className="rounded-2xl bg-[#0b1a13] p-4 text-white"><p className="text-sm text-emerald-200">Racha actual</p><p className="text-4xl font-black">🔥 {racha.actual}</p></div>
            <div className="rounded-2xl bg-white p-4 ring-1 ring-slate-200"><p className="text-sm text-slate-600">Mejor racha</p><p className="text-4xl font-black">{racha.mejor}</p></div>
          </div>
          <p className="mt-3 text-sm text-slate-700">{sesiones.has(HOY) ? 'Hoy ya entrenaste ✓' : racha.hoyEsDescanso ? 'Hoy descansas: tu racha sigue.' : 'Hoy toca entrenar.'}</p>
        </div>
      </div>
    </Seccion>
  );
}

  const cifras = [['533', 'pruebas automáticas'], ['58', 'pasos del recorrido probados'], ['14', 'pantallas auditadas'], ['0', 'errores de redondeo: peso en gramos']];
  return (
    <Seccion id="para-todos" className="bg-[#f5f8f6]">
      <Etiqueta>Para todos</Etiqueta>
      <Titulo id="para-todos">Fácil para empezar. Serio por dentro.</Titulo>
      <div className="mt-10 grid gap-4 md:grid-cols-3">
        {columnas.map(([icono, t, items]) => (
          <article key={t} className="rounded-3xl bg-white p-7 ring-1 ring-slate-200">
            <p aria-hidden="true" className="text-3xl">{icono}</p>
            <h3 className="mt-3 text-xl font-bold">{t}</h3>
            <ul className="mt-3 space-y-2 text-slate-700">{items.map((x) => <li key={x}>• {x}</li>)}</ul>
          </article>
        ))}
      </div>
      <dl className="mt-10 grid gap-4 rounded-3xl bg-[#0b1a13] p-8 text-white sm:grid-cols-4">
        {cifras.map(([n, t]) => (
          <div key={t}><dt className="sr-only">{t}</dt><dd className="text-4xl font-black text-emerald-300">{n}</dd><dd className="text-sm text-emerald-50/80">{t}</dd></div>
        ))}
      </dl>
      <p className="mt-4 text-center text-sm text-slate-600">Hecho con Next.js 15, React 19, Supabase (Postgres) y Groq, publicado en Vercel.</p>
    </Seccion>
  );
}

  return (
    <Seccion id="entrega" className="bg-white">

      <div className="mt-10 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">

          <article key={t} className="rounded-3xl bg-[#f5f8f6] p-6 ring-1 ring-slate-200">

              <h3 className="text-lg font-bold">{t}</h3>
              <span className={`shrink-0 rounded-full px-2.5 py-0.5 text-xs font-bold ${estado === 'Extra' ? 'bg-sky-100 text-sky-900' : 'bg-emerald-100 text-emerald-900'}`}>{estado}</span>
            </div>
            <ul className="mt-4 space-y-2 text-sm text-slate-700">
              {items.map((x) => <li key={x} className="flex gap-2"><span aria-hidden="true" className="text-[#2b7650]">✓</span>{x}</li>)}

        ))}
      </div>
      <div className="mt-6 grid gap-4 md:grid-cols-2">
        <p className="rounded-2xl bg-[#0b1a13] p-5 text-sm leading-relaxed text-emerald-50/90">
          <strong className="text-emerald-300">Aceptación: </strong>las 14 pruebas obligatorias (A-01 a A-14) y la opcional (A-15) pasan en local y en el sitio publicado.

        <p className="rounded-2xl bg-[#e4f1ea] p-5 text-sm leading-relaxed text-[#1d5238]">
          <strong>Evolución: </strong>el plan proponía guardar los datos en archivos JSON con la opción de pasar a una base de datos. El proyecto ya dio ese paso: usa Postgres en Supabase.
        </p>

}
