<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Referencia: intro de CHRONO (corte, sello y laurel)</title>
<!-- Referencia de diseño para portar a la app. Línea de tiempo (con --v: 1):
     0,25 s tajo 1 · 0,33 s se graba el trazo grueso de la Χ · 0,58 s tajo 2 · 0,66 s trazo fino
     0,95 s sello (rebote, onda, temblor y brillo de la Χ) · 1,05–1,98 s llegan los laureles y brotan las hojas
     1,95 s unión (laureles se cierran) · 2,00 s aparece la baldosa · 2,45 s destello · 2,40–3,10 s palabra CHRONO
     --v multiplica todas las duraciones y retrasos (1 = normal, 1,6 = lenta, 0,7 = rápida). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap">
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:#0d0918;font-family:system-ui,sans-serif}
button{min-height:44px;padding:0 20px;border-radius:999px;border:1px solid #6a4bbd;background:#6a4bbd;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.anim *{animation-fill-mode:both;animation-timing-function:cubic-bezier(.22,1,.36,1)}
.anim .escena{animation:temblor calc(var(--v)*.28s) calc(var(--v)*.95s) linear both}
.anim .halo{animation:aparecerHalo calc(var(--v)*.7s) calc(var(--v)*1.95s) both}
.anim .baldosa{animation:baldosa calc(var(--v)*.6s) calc(var(--v)*2s) cubic-bezier(.34,1.56,.64,1) both}
.anim .brillo{animation:brillo calc(var(--v)*.8s) calc(var(--v)*2.45s) ease-in-out both}
.anim .tajo{stroke-dasharray:62;filter:drop-shadow(0 0 1.5px #ffffff) drop-shadow(0 0 3px #b79cff)}
.anim .tajo-1{animation:tajo calc(var(--v)*.5s) calc(var(--v)*.25s) both}
.anim .tajo-2{animation:tajo calc(var(--v)*.5s) calc(var(--v)*.58s) both}
.anim .chispa{animation:chispa calc(var(--v)*.45s) ease-out both}
.anim .sello{transform-box:view-box;transform-origin:32px 32px;animation:sello calc(var(--v)*.45s) calc(var(--v)*.95s) cubic-bezier(.34,1.56,.64,1) both}
.anim .onda{transform-box:view-box;transform-origin:32px 32px;animation:onda calc(var(--v)*.7s) calc(var(--v)*.95s) ease-out both}
.anim .vuelo-i{transform-box:view-box;transform-origin:25px 55px;animation:vueloI calc(var(--v)*.85s) calc(var(--v)*1.05s) cubic-bezier(.2,.9,.25,1.12) both}
.anim .vuelo-d{transform-box:view-box;transform-origin:39px 55px;animation:vueloD calc(var(--v)*.85s) calc(var(--v)*1.13s) cubic-bezier(.2,.9,.25,1.12) both}
.anim .union-i{animation:unirI calc(var(--v)*.4s) calc(var(--v)*1.95s) cubic-bezier(.34,1.56,.64,1) both}
.anim .union-d{animation:unirD calc(var(--v)*.4s) calc(var(--v)*1.95s) cubic-bezier(.34,1.56,.64,1) both}
.anim .rama{stroke-dasharray:52;animation:rama calc(var(--v)*.7s) calc(var(--v)*1.05s) both}
.anim .hoja{transform-box:fill-box;transform-origin:center;animation:hoja calc(var(--v)*.35s) cubic-bezier(.34,1.56,.64,1) both}
.anim .marca{animation:marca calc(var(--v)*.7s) calc(var(--v)*2.4s) both}
@keyframes temblor{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,1px)}}
@keyframes aparecerHalo{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes baldosa{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes brillo{from{transform:translateX(-140%) skewX(-12deg)}to{transform:translateX(320%) skewX(-12deg)}}
@keyframes tajo{0%{stroke-dashoffset:62;opacity:1}45%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes chispa{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(var(--dx),var(--dy))}}
@keyframes sello{0%{transform:scale(1)}35%{transform:scale(1.28)}65%{transform:scale(.93)}100%{transform:scale(1)}}
@keyframes onda{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(3.4)}}
@keyframes vueloI{0%{opacity:0;transform:translate(-70px,26px) rotate(-55deg)}60%{opacity:1;transform:translate(-3px,-2px) rotate(5deg)}100%{opacity:1;transform:translate(-6px,0) rotate(0deg)}}
@keyframes vueloD{0%{opacity:0;transform:translate(70px,26px) rotate(55deg)}60%{opacity:1;transform:translate(3px,-2px) rotate(-5deg)}100%{opacity:1;transform:translate(6px,0) rotate(0deg)}}
@keyframes unirI{from{transform:translate(0,0)}to{transform:translate(6px,0)}}
@keyframes unirD{from{transform:translate(0,0)}to{transform:translate(-6px,0)}}
@keyframes rama{from{stroke-dashoffset:52}to{stroke-dashoffset:0}}
@keyframes hoja{from{opacity:0;transform:scale(0) rotate(-35deg)}to{opacity:1;transform:scale(1) rotate(0deg)}}
@keyframes marca{from{opacity:0;letter-spacing:.7em}to{opacity:1;letter-spacing:.22em}}
.anim .revela{stroke-dasharray:31}
.anim .revela-1{animation:revela calc(var(--v)*.2s) calc(var(--v)*.33s) both}
.anim .revela-2{animation:revela calc(var(--v)*.2s) calc(var(--v)*.66s) both}
.anim .herida{animation:latir calc(var(--v)*.9s) calc(var(--v)*.95s) ease-out both}
@keyframes revela{from{stroke-dashoffset:31}to{stroke-dashoffset:0}}
@keyframes latir{0%{filter:drop-shadow(0 0 0 rgba(183,156,255,0))}30%{filter:drop-shadow(0 0 3px rgba(239,232,255,.95))}100%{filter:drop-shadow(0 0 1.2px rgba(183,156,255,.7))}}
@media (prefers-reduced-motion: reduce){.anim *{animation-duration:1ms !important;animation-delay:0s !important}}
</style>
</head>
<body>

<div class="halo" style="position: absolute; width: 420px; height: 420px; border-radius: 999px; background: radial-gradient(circle, rgba(123, 85, 230, 0.45) 0%, rgba(123, 85, 230, 0) 65%)"></div>

tyle="animation-delay: calc(var(--v) * 1.74s)"><g transform="translate(16.00 14.00) rotate(-67.6) scale(0.82)"><path fill="url(#gT)" stroke="none" d="M0 0C2.3-2.2 5.8-2.3 8.4 0C5.8 2.3 2.3 2.2 0 0Z"></path></g></g></g></g>
<g class="vuelo-d"><g class="union-d"><path class="rama" style="animation-delay: calc(var(--v) * 1.13s)" d="M39 55C51 48 55 31 48 14" stroke="url(#gT)" stroke-width="2.2"></path><g class="hoja" style="animation-delay: calc(var(--v) * 1.38s)"><g transform="translate(42.36 52.61) rotate(357.4) scale(1.05)"><path fill="url(#gT)" stroke="none" d="M0 0C2.3-2.2 5.8-2.3 8.4 0C5.8 2.3 2.3 2.2 0 0Z"></path></g></g><g class="hoja" style="animation-delay: calc(var(--v) * 1.44s)"><g transform="translate(46.22 48.37) rotate(343.4) scale(1.00)"><path fill="url(#gT)" stroke="none" d="M0 0C2.3-2.2 5.8-2.3 8.4 0C5.8 2.3 2.3 2.2 0 0Z"></path></g></g><g class="hoja" style="animation-delay: calc(var(--v) * 1.49s)"><g transform="translate(49.05 43.24) rotate(330.6) scale(0.96)"><path fill="url(#gT)" stroke="none" d="M0 0C2.3-2.2 5.8-2.3 8.4 0C5.8 2.3 2.3 2.2 0 0Z"></path></g></g><g class="hoja" style="animation-delay: calc(var(--v) * 1.55s)"><g transform="translate(50.07 40.39) rotate(246.7) scale(0.72)"><path fill="url(#gT)" stroke="none" d="M0 0C2.3-2.2 5.8-2.3 8.4 0C5.8 2.3 2.3 2.2 0 0Z"></path></g></g><g class="hoja" style="animation-delay: calc(var(--v) * 1.60s)"><g transform="translate(50.81 37.37) rotate(319.0) scale(0.91)"><path fill="url(#gT)" stroke="none" d="M0 0C2.3-2.2 5.8-2.3 8.4 0C5.8 2.3 2.3 2.2 0 0Z"></path></g></g><g class="hoja" style="animation-delay: calc(var(--v) * 1.66s)"><g transform="translate(51.44 30.95) rotate(308.5) scale(0.87)"><path fill="url(#gT)" stroke="none" d="M0 0C2.3-2.2 5.8-2.3 8.4 0C5.8 2.3 2.3 2.2 0 0Z"></path></g></g><g class="hoja" style="animation-delay: calc(var(--v) * 1.71s)"><g transform="translate(51.39 28.55) rotate(226.9) scale(0.72)"><path fill="url(#gT)" stroke="none" d="M0 0C2.3-2.2 5.8-2.3 8.4 0C5.8 2.3 2.3 2.2 0 0Z"></path></g></g><g class="hoja" style="animation-delay: calc(var(--v) * 1.77s)"><g transform="translate(50.90 24.12) rotate(298.7) scale(0.82)"><path fill="url(#gT)" stroke="none" d="M0 0C2.3-2.2 5.8-2.3 8.4 0C5.8 2.3 2.3 <g class="sello"><g class="herida">

<g mask="url(#mB)"><path fill="url(#gT)" stroke="none" d="M39.49 21.2L41.79 21.2L24.51 42.8L22.21 42.8Z"></path><rect fill="url(#gT)" stroke="none" x="36.6" y="20.2" width="8.1" height="1.7" rx="0.4"></rect><rect fill="url(#gT)" stroke="none" x="19.3" y="42.1" width="8.1" height="1.7" rx="0.4"></rect></g>
</g></g>

<circle class="chispa" cx="24.5" cy="21.5" r="0.9" fill="#efe8ff" style="--dx: -7px; --dy: -7px; animation-delay: calc(var(--v) * 0.42s)"></circle><circle class="chispa" cx="39.5" cy="42.5" r="0.9" fill="#efe8ff" style="--dx: 7px; --dy: 7px; animation-delay: calc(var(--v) * 0.47s)"></circle><circle class="chispa" cx="32" cy="32" r="0.9" fill="#efe8ff" style="--dx: -2px; --dy: 8px; animation-delay: calc(var(--v) * 0.45s)"></circle><circle class="chispa" cx="39.5" cy="21.5" r="0.9" fill="#efe8ff" style="--dx: 7px; --dy: -7px; animation-delay: calc(var(--v) * 0.77s)"></circle><circle class="chispa" cx="24.5" cy="42.5" r="0.9" fill="#efe8ff" style="--dx: -7px; --dy: 7px; animation-delay: calc(var(--v) * 0.82s)"></circle><circle class="chispa" cx="32" cy="32" r="0.9" fill="#efe8ff" style="--dx: 8px; --dy: -1px; animation-delay: calc(var(--v) * 0.8s)"></circle>

<p class="marca" style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.22em; color: #f3effc">CHRONO</p></div>

<button type="button" id="repetir">Repetir animación</button>
<script>
document.getElementById('repetir').addEventListener('click', function () {
  var c = document.getElementById('escenario');
  var nuevo = c.firstElementChild.cloneNode(true);
  c.replaceChild(nuevo, c.firstElementChild);
});
</script>
